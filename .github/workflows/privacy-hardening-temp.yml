name: Privacy Hardening Patch

on:
  push:
    branches:
      - audit/privacy-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'nextjob-privacy-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/privacy-hardening-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply privacy patch
        run: node scripts/apply-privacy-hardening-temp.mjs
      - name: Verify TypeScript and build
        run: |
          npm ci
          npm run seo:check
          npm run lint
          npm run build
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nextjob-privacy-bot"
          git config user.email "nextjob-privacy-bot@users.noreply.github.com"
          git add -A
          git commit -m "Harden candidate privacy and avatar ownership"
          git push origin HEAD:audit/privacy-hardening-20260826
