name: Trusted External Jobs Sync

on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config/job-sources.json'
      - 'config/arabic-job-sources.json'
      - 'scripts/sync-external-jobs.mjs'
      - 'scripts/append-arabic-rss-jobs.mjs'
      - 'scripts/append-community-job-intake.mjs'
      - 'scripts/filter-yemeni-target-jobs.mjs'
      - 'scripts/validate-external-jobs.mjs'
      - 'data/manual-external-jobs.json'
      - 'data/community-job-intake.json'
      - '.github/workflows/external-jobs-sync.yml'

permissions:
  contents: write

concurrency:
  group: nextjob-trusted-external-jobs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify trusted source registry
        run: npm run jobs:sources-check

      - name: Fetch official API job sources
        run: npm run jobs:sync

      - name: Append permitted Arabic RSS feeds
        run: node scripts/append-arabic-rss-jobs.mjs

      - name: Append approved community intake
        run: node scripts/append-community-job-intake.mjs

      - name: Apply Yemeni audience targeting and Arabic display
        run: node scripts/filter-yemeni-target-jobs.mjs

      - name: Verify generated feed and application destinations
        run: |
          node --check scripts/append-arabic-rss-jobs.mjs
          node --check scripts/append-community-job-intake.mjs
          node --check scripts/filter-yemeni-target-jobs.mjs
          node scripts/filter-yemeni-target-jobs.mjs --check
          npm run jobs:check
          npm audit --omit=dev --audit-level=high
          npm run security:check
          npm run lint
          npm run build

      - name: Commit refreshed public job index
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          cp public/jobs/external-jobs.json "$TMP_DIR/external-jobs.json"
          cp data/job-source-health.json "$TMP_DIR/job-source-health.json"

          # A queued run may have checked out an older event SHA while another
          # sync updated the generated snapshots. Rebase would then conflict.
          # Move to the latest branch tip first, then apply this run's complete
          # generated snapshots on top of it.
          git restore --worktree -- .
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          cp "$TMP_DIR/external-jobs.json" public/jobs/external-jobs.json
          cp "$TMP_DIR/job-source-health.json" data/job-source-health.json
          git add public/jobs/external-jobs.json data/job-source-health.json

          if git diff --cached --quiet; then
            echo "No external job feed changes."
            exit 0
          fi

          git config user.name "nextjob-source-bot"
          git config user.email "nextjob-source-bot@users.noreply.github.com"
          git commit -m "Sync targeted Arabic jobs for Yemeni audience"
          git push origin HEAD:"$BRANCH"
