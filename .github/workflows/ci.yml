name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run seo:check
      - run: npm run jobs:sources-check
      - run: npm run jobs:check
      - run: npm run security:check
      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools@15.28.1 emulators:exec --only firestore --project demo-nextjob "node -e \"console.log('Firestore rules compiled successfully')\""
      - run: npm run lint
      - run: npm run build
