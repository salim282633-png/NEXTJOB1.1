name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Normalize lockfile for npm 11
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Persist repaired lockfile on audit branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/security-hardening-20260826'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized."
            exit 0
          fi
          git config user.name "nextjob-audit-bot"
          git config user.email "nextjob-audit-bot@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Node 24"
          git push origin HEAD:audit/security-hardening-20260826
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run seo:check
      - run: npm run lint
      - run: npm run build
