name: Fix Privacy Rules

on:
  push:
    branches:
      - audit/privacy-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'nextjob-privacy-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/privacy-hardening-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct Firestore rules
        run: node scripts/fix-privacy-rules-temp.mjs
      - name: Verify source checks
        run: |
          npm ci
          npm run seo:check
          npm run lint
          grep -F "candidateOwners/{candidateId}" firestore.rules
          grep -F "schemaVersion == 3" firestore.rules
          ! grep -F "[0-9]{8}  }" firestore.rules
      - name: Commit corrected rules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nextjob-privacy-bot"
          git config user.email "nextjob-privacy-bot@users.noreply.github.com"
          git add -A
          git commit -m "Correct privacy rules and reclaim guard"
          git push origin HEAD:audit/privacy-hardening-20260826
