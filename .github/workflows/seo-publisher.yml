name: Yemen-focused SEO Publisher

on:
  schedule:
    # Check every hour at :15. The publisher itself enforces a minimum
    # 6-hour interval between successful articles, so missed cron windows
    # are retried on the next hourly check instead of waiting another 6 hours.
    - cron: '15 * * * *'
  # Recovery trigger: changing only this marker starts the same protected
  # publisher immediately. The internal 6-hour gate still prevents duplicates.
  push:
    paths:
      - 'seo/publisher-trigger.txt'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'اختياري: كلمة مستهدفة يجب أن تخص اليمنيين + الوظائف + السعودية'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nextjob-yemeni-seo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate one production article when eligible
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Preferred model only. The fallback runner discovers models available
          # to this API key and switches automatically when this model is
          # unavailable, rate-limited, temporarily unavailable, or fails the
          # production quality gate.
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_MAX_MODEL_ATTEMPTS: 4
          SEO_MIN_PUBLISH_INTERVAL_HOURS: 6
          PUBLIC_SITE_URL: https://nextjob1-1.onrender.com
          SEO_KEYWORD: ${{ github.event.inputs.keyword || '' }}
        run: |
          node scripts/run-seo-publisher-with-fallback.mjs
          node scripts/style-guide-index.mjs
          node scripts/style-guide-articles.mjs
          node scripts/apply-static-typography.mjs public/guide

      - name: Commit published article
        shell: bash
        run: |
          set -e
          git add -A public/guide public/sitemap.xml seo
          if git diff --cached --quiet; then
            echo "No production SEO article was published."
            exit 0
          fi
          git config user.name "nextjob-seo-bot"
          git config user.email "nextjob-seo-bot@users.noreply.github.com"
          git commit -m "Publish Yemen-focused SEO article"
          git pull --rebase origin main
          git push origin HEAD:main
