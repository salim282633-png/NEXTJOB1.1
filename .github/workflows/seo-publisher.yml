name: Yemen-focused SEO Publisher

on:
  schedule:
    # Check four times per hour to reduce the impact of delayed/dropped
    # GitHub scheduled runs. The publisher still enforces a minimum
    # 1-hour interval between successful articles.
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - 'seo/publisher-trigger.txt'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'اختياري: كلمة مستهدفة يجب أن تخص اليمنيين + الوظائف + السعودية'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nextjob-yemeni-seo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate one production article when eligible
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_MAX_MODEL_ATTEMPTS: 4
          SEO_MIN_PUBLISH_INTERVAL_HOURS: 1
          PUBLIC_SITE_URL: https://nextjob1-1.onrender.com
          SEO_KEYWORD: ${{ github.event.inputs.keyword || '' }}
        run: |
          node scripts/run-seo-publisher-with-fallback.mjs
          node scripts/normalize-content-hub-seo.mjs
          node scripts/style-guide-index.mjs
          node scripts/style-guide-articles.mjs
          node scripts/apply-static-typography.mjs public/guide
          node scripts/normalize-content-hub-seo.mjs

      - name: Verify generated repository state
        run: |
          npm audit --omit=dev --audit-level=high
          npm run seo:check
          npm run jobs:check
          npm run security:check
          npm run lint
          npm run build

      - name: Commit published article
        shell: bash
        run: |
          set -euo pipefail
          git add -A public/guide public/sitemap.xml seo
          if git diff --cached --quiet; then
            echo "No production SEO article was published."
            git restore --worktree -- .
            exit 0
          fi
          git config user.name "nextjob-seo-bot"
          git config user.email "nextjob-seo-bot@users.noreply.github.com"
          git commit -m "Publish Yemen-focused SEO article"
          # Production verification rewrites static HTML outside the SEO outputs.
          # The article commit is already complete, so discard only remaining
          # worktree-only verification changes before rebasing and publishing.
          git restore --worktree -- .
          git pull --rebase origin main
          git push origin HEAD:main
