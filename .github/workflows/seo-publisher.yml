name: NEXT JOB SEO Publisher

on:
  schedule:
    # One article per UTC hour. Minute 17 avoids GitHub's start-of-hour load peak.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'اختياري: كلمة مستهدفة تخص اليمنيين والعمل والمسار المهني في السعودية'
        required: false
        type: string
      scheduler:
        description: 'مصدر التشغيل الآلي'
        required: false
        type: string
      scheduled_slot:
        description: 'الساعة المجدولة بصيغة ISO للتتبع ومنع الانزلاق'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nextjob-seo-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync guide manifest before eligibility
        run: node scripts/sync-guide-manifest.mjs

      - name: Check automated publish eligibility
        id: eligibility
        shell: bash
        env:
          SEO_FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler != 'render-cron' }}
          SEO_PUBLISH_SLOT_MINUTES: 60
        run: |
          set -euo pipefail
          echo "Requested slot: ${{ github.event.inputs.scheduled_slot || github.event.schedule || 'manual' }}"
          node --check scripts/seo-publish-cadence.mjs
          node --check scripts/check-seo-publish-eligibility.mjs
          node --check scripts/check-hourly-publisher-config.mjs
          node scripts/check-hourly-publisher-config.mjs
          node scripts/check-seo-publish-eligibility.mjs

      - name: Setup Node
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.eligibility.outputs.eligible == 'true'
        run: npm ci

      - name: Generate one guidance article when eligible
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_MAX_MODEL_ATTEMPTS: 8
          SEO_PUBLISH_CADENCE_MODE: hourly-slot
          SEO_PUBLISH_SLOT_MINUTES: 60
          SEO_FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler != 'render-cron' }}
          SEO_REQUIRE_ARTICLE: true
          PUBLIC_SITE_URL: https://nextjob1-1.onrender.com
          SEO_KEYWORD: ${{ github.event.inputs.keyword || '' }}
        run: |
          node scripts/sync-guide-manifest.mjs
          node scripts/run-seo-publisher-with-fallback.mjs
          node scripts/sync-guide-manifest.mjs
          node scripts/normalize-content-hub-seo.mjs
          node scripts/style-guide-index.mjs
          node scripts/style-guide-articles.mjs
          node scripts/build-guide-categories.mjs
          node scripts/inject-guide-category-nav.mjs
          node scripts/apply-static-typography.mjs public/guide
          node scripts/normalize-content-hub-seo.mjs
          node scripts/normalize-guidance-identity.mjs
          node scripts/hide-opportunities-ui.mjs
          node scripts/polish-blog-ui.mjs
          node scripts/polish-guide-articles-ui.mjs
          node scripts/rebuild-public-sitemap.mjs

      - name: Verify article and production build
        if: steps.eligibility.outputs.eligible == 'true'
        run: |
          npm audit --omit=dev --audit-level=high
          npm run seo:check
          npm run jobs:check
          npm run security:check
          npm run lint
          npm run build

      - name: Publish article to latest main without rebase conflicts
        if: steps.eligibility.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          git add -A public/guide public/sitemap.xml seo

          if git diff --cached --quiet; then
            echo "No article is due yet; publisher completed normally."
            git restore --staged --worktree -- .
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          tar -czf "$TMP_DIR/seo-output.tgz" public/guide public/sitemap.xml seo

          git restore --staged --worktree -- .
          git fetch origin main

          if ! git diff --quiet "$BASE_SHA" origin/main -- public/guide public/sitemap.xml seo; then
            echo "Concurrent SEO publication detected; newer main content is kept."
            git reset --hard origin/main
            exit 0
          fi

          git reset --hard origin/main
          tar -xzf "$TMP_DIR/seo-output.tgz"
          git add -A public/guide public/sitemap.xml seo

          if git diff --cached --quiet; then
            echo "SEO output is already present on latest main."
            exit 0
          fi

          git config user.name "nextjob-seo-bot"
          git config user.email "nextjob-seo-bot@users.noreply.github.com"
          git commit -m "Publish NEXT JOB guidance article"
          git push origin HEAD:main

      - name: Persist published articles in Firestore
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: npx tsx scripts/sync-firestore-content.ts --articles
