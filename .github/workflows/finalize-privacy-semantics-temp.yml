name: Finalize Privacy Semantics

on:
  push:
    branches:
      - audit/privacy-hardening-20260826

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'nextjob-privacy-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/privacy-hardening-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply final privacy semantics
        run: node scripts/finalize-privacy-semantics-temp.mjs
      - name: Verify source checks
        run: |
          npm ci
          npm run seo:check
          npm run lint
          grep -F "data.phoneVerified == candidateData(candidateId).phoneVerified" firestore.rules
          grep -F "sanitizeLegacyJobsAsAdmin" src/lib/firebase.ts
      - name: Commit finalized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nextjob-privacy-bot"
          git config user.email "nextjob-privacy-bot@users.noreply.github.com"
          git add -A
          git commit -m "Finalize candidate privacy semantics"
          git push origin HEAD:audit/privacy-hardening-20260826
