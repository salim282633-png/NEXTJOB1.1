services:
  - type: web
    name: nextjob1-1
    runtime: static
    repo: https://github.com/salim282633-png/NEXTJOB1.1
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html

  - type: cron
    name: nextjob-seo-scheduler
    runtime: node
    repo: https://github.com/salim282633-png/NEXTJOB1.1
    branch: main
    schedule: '7,17,27,37,47,57 * * * *'
    buildCommand: echo "No build required"
    startCommand: node scripts/trigger-seo-workflow.mjs
    envVars:
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
