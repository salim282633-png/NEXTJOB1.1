services:
  - type: web
    name: nextjob1-1
    runtime: static
    repo: https://github.com/salim282633-png/NEXTJOB1.1
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
    # Temporary SEO pause for دليل الفرص. Remove these rules when the section returns.
    headers:
      - path: /jobs
        name: X-Robots-Tag
        value: "noindex, follow"
      - path: /jobs/*
        name: X-Robots-Tag
        value: "noindex, follow"
      - path: /candidates
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /candidates/*
        name: X-Robots-Tag
        value: "noindex, nofollow"

  - type: cron
    name: nextjob-seo-scheduler
    runtime: node
    repo: https://github.com/salim282633-png/NEXTJOB1.1
    branch: main
    # Monday, Wednesday, Saturday at 07:15 Saudi time (04:15 UTC).
    schedule: '15 4 * * 1,3,6'
    buildCommand: echo "No build required"
    startCommand: node scripts/trigger-seo-workflow.mjs
    envVars:
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
